name: Publicar no GitHub Pages

# 1) Quando este workflow roda: a cada push na branch main
on:
  push:
    branches: [main]

# 2) Permissoes que o workflow precisa para publicar
permissions:
  contents: read
  pages: write
  id-token: write

# 3) Os passos que serao executados
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar o codigo do repositorio
        uses: actions/checkout@v7

      - name: Configurar o GitHub Pages
        uses: actions/configure-pages@v6

      - name: Empacotar o site como artefato
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5